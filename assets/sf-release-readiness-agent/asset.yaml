apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: sf-release-readiness-agent
  description: AI agent that helps SuccessFactors administrators review required changes before a new release, assess impact across multiple tenants, and automatically apply low-risk configuration changes with human confirmation.

type: agent

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: sf-release-readiness-agent
      kind: a2a
      ordId: customer.build:apiResource:sf-release-readiness-ba5a6.sf-release-readiness-agent:v1

requires:
  - name: pltrolebasedpermissions-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sf-release-readiness-ba5a6.pltrolebasedpermissions-mcp-server:v1
  - name: pltgenericobjects-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sf-release-readiness-ba5a6.pltgenericobjects-mcp-server:v1
  - name: foundationplatformplt-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sf-release-readiness-ba5a6.foundationplatformplt-mcp-server:v1
  - name: pltusermanagement-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sf-release-readiness-ba5a6.pltusermanagement-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
